concessionaria_dbt_course:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'dev.duckdb') }}"
      threads: 4
      extensions:
        - postgres
      attach:
        - path: >-
            host={{ env_var('SOURCE_POSTGRES_HOST') }}
            port={{ env_var('SOURCE_POSTGRES_PORT', '5432') }}
            dbname={{ env_var('SOURCE_POSTGRES_DATABASE') }}
            user={{ env_var('SOURCE_POSTGRES_USER') }}
            password={{ env_var('SOURCE_POSTGRES_PASSWORD') }}
            sslmode={{ env_var('SOURCE_POSTGRES_SSLMODE', 'require') }}
          type: postgres
          alias: pg_origem